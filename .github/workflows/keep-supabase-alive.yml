name: Keep Supabase Alive

# Supabase free-tier projects pause after 7 days with no DB/API activity.
# This makes a tiny external request to the REST API on a schedule so the
# project never goes idle long enough to be paused. It runs independently of
# the backend host, so it works even if that host sleeps.

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days at 06:00 UTC (well within the 7-day window)
  workflow_dispatch: {} # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY secrets are not set."
            exit 1
          fi
          echo "Pinging $SUPABASE_URL ..."
          curl -fsS \
            "$SUPABASE_URL/rest/v1/users?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "Supabase pinged successfully."
